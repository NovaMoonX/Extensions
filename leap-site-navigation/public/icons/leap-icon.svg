<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Lily pad -->
  <ellipse cx="64" cy="106" rx="54" ry="18" fill="#2E7D32"/>
  <!-- Lily pad vein lines -->
  <line x1="64" y1="106" x2="64" y2="88" stroke="#1B5E20" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="24" y2="98" stroke="#1B5E20" stroke-width="1" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="104" y2="98" stroke="#1B5E20" stroke-width="1" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="32" y2="112" stroke="#1B5E20" stroke-width="1" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="96" y2="112" stroke="#1B5E20" stroke-width="1" stroke-linecap="round"/>
  <!-- Lily pad notch (wedge cut) -->
  <path d="M 64 88 L 80 96 A 54 18 0 0 0 64 88 Z" fill="#1B5E20" opacity="0.4"/>

  <!-- Frog body -->
  <ellipse cx="64" cy="76" rx="38" ry="32" fill="#4CAF50"/>

  <!-- Left eye socket (raised bump) -->
  <circle cx="44" cy="50" r="17" fill="#4CAF50"/>
  <circle cx="44" cy="50" r="15" fill="#81C784"/>
  <!-- Right eye socket (raised bump) -->
  <circle cx="84" cy="50" r="17" fill="#4CAF50"/>
  <circle cx="84" cy="50" r="15" fill="#81C784"/>

  <!-- Left pupil -->
  <circle cx="44" cy="50" r="9" fill="#1B3022"/>
  <!-- Right pupil -->
  <circle cx="84" cy="50" r="9" fill="#1B3022"/>

  <!-- Eye shines -->
  <circle cx="48" cy="46" r="3.5" fill="white"/>
  <circle cx="88" cy="46" r="3.5" fill="white"/>
  <!-- Secondary shine -->
  <circle cx="41" cy="53" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="81" cy="53" r="1.5" fill="white" opacity="0.6"/>

  <!-- Nostrils -->
  <circle cx="58" cy="69" r="3" fill="#388E3C"/>
  <circle cx="70" cy="69" r="3" fill="#388E3C"/>

  <!-- Smile -->
  <path d="M 48 82 Q 64 96 80 82" stroke="#2E7D32" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Belly highlight (subtle organic feel) -->
  <ellipse cx="64" cy="82" rx="22" ry="14" fill="#81C784" opacity="0.25"/>

  <!-- Tiny front legs / hands peeking out -->
  <ellipse cx="30" cy="90" rx="9" ry="6" fill="#388E3C" transform="rotate(-20 30 90)"/>
  <ellipse cx="98" cy="90" rx="9" ry="6" fill="#388E3C" transform="rotate(20 98 90)"/>
</svg>
