<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#2563EB"/>
  
  <!-- Wing shape: sweeping from left-bottom to right-top -->
  <!-- Primary wing feather sweep -->
  <path d="M 20 95 
           C 25 70, 45 50, 80 30
           C 85 27, 108 20, 108 20
           C 108 20, 100 40, 95 48
           C 80 68, 55 80, 20 95 Z" 
        fill="white" opacity="0.95"/>
  
  <!-- Secondary wing layer (depth) -->
  <path d="M 20 95
           C 30 78, 50 62, 75 45
           C 82 40, 100 35, 100 35
           C 95 48, 82 60, 65 72
           C 50 82, 35 90, 20 95 Z"
        fill="white" opacity="0.4"/>

  <!-- Small accent dot (speed/motion) -->
  <circle cx="90" cy="38" r="4" fill="#F59E0B"/>
</svg>
