<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
  <!-- Offscreen document for semantic search inference -->
  <script type="module">
    import { getLinks, getTags } from '../utils/storage.js';
    import { syncVectors, semanticSearch } from '../utils/embeddings.js';

    let vectorSyncInProgress = false;

    async function ensureVectorsSynced() {
      if (vectorSyncInProgress) return;
      
      vectorSyncInProgress = true;
      try {
        const [links, tags] = await Promise.all([getLinks(), getTags()]);
        if (Object.keys(links).length > 0) {
          await syncVectors(links, tags);
        }
      } catch (err) {
        console.warn('[Pteron Offscreen] Vector sync failed:', err);
      } finally {
        vectorSyncInProgress = false;
      }
    }

    chrome.runtime.onMessage.addListener(async (message, sender, sendResponse) => {
      if (message.type === 'SEMANTIC_SEARCH') {
        try {
          await ensureVectorsSynced();
          const results = await semanticSearch(
            message.query,
            message.excludeKeywords,
            message.threshold,
            message.limit,
          );
          sendResponse({ success: true, results });
        } catch (err) {
          console.warn('[Pteron Offscreen] Semantic search failed:', err);
          sendResponse({ success: false, error: err.message });
        }
        return true;
      }
    });

    void ensureVectorsSynced();
  </script>
</body>
</html>
